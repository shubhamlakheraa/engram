<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engram Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="logo">engram</div>
        <p class="tagline">Solve once. Remember forever.</p>
      </header>

      <!-- Notion Setup -->
      <section class="section">
        <div class="section-header">
          <div class="section-icon">N</div>
          <div>
            <h2 class="section-title">Notion</h2>
            <p class="section-desc">Your solved problems are logged here as a database.</p>
          </div>
          <span id="notion-status" class="status-dot"></span>
        </div>

        <div class="field">
          <label class="label" for="notion-key">
            Integration Token
            <a href="https://www.notion.so/my-integrations" target="_blank" class="label-link">Get yours →</a>
          </label>
          <input
            id="notion-key"
            type="password"
            class="input"
            placeholder="secret_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
            autocomplete="off"
          />
        </div>

        <div class="field">
          <label class="label" for="notion-db">
            Database ID
            <span class="label-hint">Paste a Notion page URL or use "Create Database" below</span>
          </label>
          <input
            id="notion-db"
            type="text"
            class="input"
            placeholder="https://notion.so/... or paste database ID"
          />
        </div>

        <div class="field">
          <label class="label" for="notion-parent">
            Parent Page ID <span class="optional">(for auto-create)</span>
          </label>
          <input
            id="notion-parent"
            type="text"
            class="input"
            placeholder="Notion page URL where database will be created"
          />
        </div>

        <div class="btn-row">
          <button id="btn-notion-test" class="btn-secondary">Test Connection</button>
          <button id="btn-notion-create-db" class="btn-secondary">Create Database</button>
        </div>
        <p id="notion-msg" class="feedback-msg"></p>
      </section>

      <!-- Google Calendar Setup -->
      <section class="section">
        <div class="section-header">
          <div class="section-icon cal">G</div>
          <div>
            <h2 class="section-title">Google Calendar</h2>
            <p class="section-desc">Review events are automatically added on your schedule.</p>
          </div>
          <span id="cal-status" class="status-dot"></span>
        </div>

        <div class="field">
          <label class="label">Calendar</label>
          <select id="cal-select" class="input select" disabled>
            <option value="">— connect to load calendars —</option>
          </select>
        </div>

        <div class="btn-row">
          <button id="btn-cal-connect" class="btn-secondary">Connect Google Account</button>
          <button id="btn-cal-load" class="btn-secondary" disabled>Load Calendars</button>
        </div>
        <p id="cal-msg" class="feedback-msg"></p>
      </section>

      <!-- SR Settings -->
      <section class="section">
        <div class="section-header">
          <div class="section-icon sr">SR</div>
          <div>
            <h2 class="section-title">Review Schedule</h2>
            <p class="section-desc">Initial intervals (days after solving) before SM-2 takes over.</p>
          </div>
        </div>

        <div class="field">
          <label class="label" for="sr-intervals">Intervals (comma-separated days)</label>
          <input
            id="sr-intervals"
            type="text"
            class="input"
            value="1, 3, 7, 14, 30"
          />
        </div>
      </section>

      <div class="footer">
        <button id="btn-save" class="btn-primary">Save Settings</button>
        <p id="save-msg" class="feedback-msg"></p>
      </div>
    </div>

    <script src="options.js" type="module"></script>
  </body>
</html>
